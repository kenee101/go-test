openapi: 3.0.0
info:
  title: Task Management API
  version: "1.0.0"
servers:
  - url: /
paths:
  /register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        '201':
          description: Created
  /login:
    post:
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /tasks:
    post:
      summary: Create a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Created
    get:
      summary: Get tasks for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /tasks/{id}:
    parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
    get:
      summary: Get a single task
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
    put:
      summary: Update a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete a task
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
  /admin/tasks:
    get:
      summary: Get all tasks (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserRegister:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]
    UserLogin:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]
    TaskCreate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        completed:
          type: boolean
